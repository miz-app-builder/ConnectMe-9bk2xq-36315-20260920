name: NexTalk CI
on:
  workflow_dispatch:
  push:
    branches: [nextalk-v1-clean]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npx expo config --type public