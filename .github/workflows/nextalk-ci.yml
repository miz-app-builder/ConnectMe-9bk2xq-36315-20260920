name: NexTalk Native CI
on:
  workflow_dispatch:
  push:
    branches: [nextalk-native-v1]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20.19.2'}
      - run: npm install --legacy-peer-deps
      - run: npx tsc --noEmit
